<svg xmlns="http://www.w3.org/2000/svg" width="1472" height="1160" viewBox="0 0 1472 1160" role="img" aria-labelledby="title desc">
<title id="title">The training loop, independent audit, and securegrade caller boundary</title>
<desc id="desc">MBPP task and first-assert prompts enter Tiny Aya Global with LoRA. Completions and full tests enter one selected historical AlignTune or securegrade callback. Numeric rewards feed AlignTune/TRL GRPO and a LoRA update. rewardcheck separately audits AlignTune, SafeTune and securegrade. Trusted tests and expected values remain in the securegrade caller. Arguments cross to a fresh candidate interpreter; untrusted return data is validated, decoded into built-ins and compared in the caller.</desc>
